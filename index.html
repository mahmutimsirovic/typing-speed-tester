<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Speed Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Typing Speed Tester</h1>
  <div id="sentence"></div>
  <input id="input" type="text" placeholder="Start typing here..." disabled>
  <div id="stats"></div>
  <button onclick="startTest()">Start Test</button>
  <button onclick="stopTest()" id="stopBtn" disabled>Stop Test</button>
  <button onclick="restartTest()" id="restartBtn" disabled>Restart</button>

  <script src="app.js"></script>
</body>
</html>
